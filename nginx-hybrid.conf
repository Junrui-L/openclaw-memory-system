user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ========== 上游服务器配置 ==========
    # 主实例 - 端口 18789
    upstream openclaw_main {
        server host.docker.internal:18789;
        # 或者使用容器名（如果在同一网络）
        # server openclaw-main:18789;
    }
    
    # 工作实例 - 端口 18790
    upstream openclaw_work {
        server host.docker.internal:18790;
    }
    
    # 测试实例 - 端口 18791
    upstream openclaw_test {
        server host.docker.internal:18791;
    }

    # ========== 方式 1: 基于路径的路由 ==========
    server {
        listen 443 ssl http2;
        server_name _;
        
        # SSL 配置
        ssl_certificate /ssl/cert.pem;
        ssl_certificate_key /ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # 主实例 - 默认路径 /
        location / {
            proxy_pass http://host.docker.internal:18789;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            
            # WebSocket 支持
            proxy_buffering off;
        }
        
        # 工作实例 - /work 路径
        location /work/ {
            proxy_pass http://host.docker.internal:18790/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
        
        # 测试实例 - /test 路径
        location /test/ {
            proxy_pass http://host.docker.internal:18791/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
        
        # 健康检查端点
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ========== 方式 2: 基于子域名的路由（可选）==========
    # 如果需要子域名，取消下面的注释并配置 DNS
    # 
    # server {
    #     listen 443 ssl http2;
    #     server_name openclaw.your-domain.com;
    #     
    #     ssl_certificate /ssl/cert.pem;
    #     ssl_certificate_key /ssl/key.pem;
    #     
    #     location / {
    #         proxy_pass http://host.docker.internal:18789;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #         proxy_set_header Host $host;
    #         proxy_read_timeout 86400;
    #     }
    # }
    # 
    # server {
    #     listen 443 ssl http2;
    #     server_name work.your-domain.com;
    #     
    #     ssl_certificate /ssl/cert.pem;
    #     ssl_certificate_key /ssl/key.pem;
    #     
    #     location / {
    #         proxy_pass http://host.docker.internal:18790;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #         proxy_set_header Host $host;
    #         proxy_read_timeout 86400;
    #     }
    # }

    # HTTP 重定向到 HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
