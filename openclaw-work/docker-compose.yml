# OpenClaw Work 实例 - 独立部署
# 端口: 8444

version: '3.8'

services:
  openclaw-work:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-work
    restart: unless-stopped
    ports:
      - "0.0.0.0:17789:18789"  # work 实例: 17789（允许外部访问）
    expose:
      - "18789"
    networks:
      - openclaw-work-net
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - INSTANCE_NAME=work
      - PUPPETEER_EXECUTABLE_PATH=/usr/lib/chromium/chromium
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/home/node/.openclaw/workspace
      # 浏览器工具
      - /usr/bin/chromium:/usr/bin/chromium:ro
      - /usr/lib/chromium:/usr/lib/chromium:ro
      - /usr/share/chromium:/usr/share/chromium:ro
      - /etc/chromium.d:/etc/chromium.d:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
      - /usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-work:
    image: nginx:alpine
    container_name: nginx-work
    restart: unless-stopped
    ports:
      - "8444:443"
      - "8084:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/ssl:ro
    networks:
      - openclaw-work-net
    depends_on:
      - openclaw-work
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  openclaw-work-net:
    driver: bridge
