<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw 管理面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        
        .header {
            background: #16213e;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #0f3460;
        }
        
        .header h1 {
            color: #e94560;
            font-size: 28px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }
        
        .instances-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .instance-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #0f3460;
            transition: transform 0.2s;
        }
        
        .instance-card:hover {
            transform: translateY(-2px);
            border-color: #e94560;
        }
        
        .instance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .instance-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-running {
            background: #00d9ff;
            color: #000;
        }
        
        .status-stopped {
            background: #e94560;
            color: #fff;
        }
        
        .instance-info {
            margin: 15px 0;
            font-size: 14px;
            color: #aaa;
        }
        
        .instance-info div {
            margin: 5px 0;
        }
        
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #e94560;
            color: #fff;
        }
        
        .btn-primary:hover {
            background: #ff6b6b;
        }
        
        .btn-secondary {
            background: #0f3460;
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: #1a4a7a;
        }
        
        .btn-success {
            background: #00d9ff;
            color: #000;
        }
        
        .btn-success:hover {
            background: #33e5ff;
        }
        
        .stats-section {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .stats-section h2 {
            color: #e94560;
            margin-bottom: 15px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .stat-item {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00d9ff;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .log-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
        }
        
        .log-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .log-content {
            background: #16213e;
            width: 90%;
            max-width: 800px;
            height: 80%;
            border-radius: 12px;
            padding: 20px;
            overflow: hidden;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .log-body {
            height: calc(100% - 50px);
            overflow-y: auto;
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }
        
        .error {
            color: #e94560;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦞 OpenClaw 管理面板</h1>
    </div>
    
    <div class="container">
        <div id="instances-container" class="instances-grid">
            <div class="loading">加载中...</div>
        </div>
        
        <div class="stats-section">
            <h2>📊 系统资源</h2>
            <div id="stats-container" class="stats-grid">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>
    
    <div id="log-modal" class="log-modal">
        <div class="log-content">
            <div class="log-header">
                <h3>📋 容器日志</h3>
                <button class="btn btn-secondary" onclick="closeLog()">关闭</button>
            </div>
            <div id="log-body" class="log-body"></div>
        </div>
    </div>
    
    <script>
        // 加载实例状态
        async function loadInstances() {
            try {
                const res = await fetch('/api/instances');
                const data = await res.json();
                
                if (!data.success) {
                    document.getElementById('instances-container').innerHTML = 
                        `<div class="error">加载失败: ${data.error}</div>`;
                    return;
                }
                
                const html = data.instances.map(inst => `
                    <div class="instance-card">
                        <div class="instance-header">
                            <span class="instance-name">${inst.name}</span>
                            <span class="status-badge ${inst.running ? 'status-running' : 'status-stopped'}">
                                ${inst.running ? '运行中' : '已停止'}
                            </span>
                        </div>
                        <div class="instance-info">
                            <div>🐳 容器: ${inst.container}</div>
                            <div>🔗 HTTPS: ${inst.port}</div>
                            <div>📡 WebSocket: ${inst.wsPort}</div>
                            <div>📌 状态: ${inst.status}</div>
                        </div>
                        <div class="actions">
                            ${inst.running ? `
                                <button class="btn btn-secondary" onclick="controlInstance('${inst.id}', 'stop')">⏹ 停止</button>
                                <button class="btn btn-success" onclick="controlInstance('${inst.id}', 'restart')">🔄 重启</button>
                            ` : `
                                <button class="btn btn-primary" onclick="controlInstance('${inst.id}', 'start')">▶ 启动</button>
                            `}
                            <button class="btn btn-secondary" onclick="showLog('${inst.id}')">📋 日志</button>
                        </div>
                    </div>
                `).join('');
                
                document.getElementById('instances-container').innerHTML = html;
            } catch (error) {
                document.getElementById('instances-container').innerHTML = 
                    `<div class="error">加载失败: ${error}</div>`;
            }
        }
        
        // 控制实例
        async function controlInstance(id, action) {
            try {
                const res = await fetch(`/api/instances/${id}/${action}`, { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    alert(`${action} 操作成功`);
                    loadInstances();
                } else {
                    alert(`操作失败: ${data.error}`);
                }
            } catch (error) {
                alert(`请求失败: ${error}`);
            }
        }
        
        // 显示日志
        async function showLog(id) {
            document.getElementById('log-modal').classList.add('active');
            document.getElementById('log-body').textContent = '加载中...';
            
            try {
                const res = await fetch(`/api/instances/${id}/logs`, { method: 'POST' });
                const data = await res.json();
                
                document.getElementById('log-body').textContent = 
                    data.success ? data.result : `错误: ${data.error}`;
            } catch (error) {
                document.getElementById('log-body').textContent = `请求失败: ${error}`;
            }
        }
        
        // 关闭日志
        function closeLog() {
            document.getElementById('log-modal').classList.remove('active');
        }
        
        // 加载资源统计
        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                
                if (!data.success) {
                    document.getElementById('stats-container').innerHTML = 
                        `<div class="error">加载失败: ${data.error}</div>`;
                    return;
                }
                
                const html = data.stats.map(stat => `
                    <div class="stat-item">
                        <div class="stat-value">${stat.cpu || '0%'}</div>
                        <div class="stat-label">${stat.name}</div>
                        <div style="font-size: 11px; color: #888; margin-top: 5px;">${stat.mem || ''}</div>
                    </div>
                `).join('');
                
                document.getElementById('stats-container').innerHTML = html;
            } catch (error) {
                document.getElementById('stats-container').innerHTML = 
                    `<div class="error">加载失败: ${error}</div>`;
            }
        }
        
        // 初始化
        loadInstances();
        loadStats();
        
        // 自动刷新
        setInterval(() => {
            loadInstances();
            loadStats();
        }, 5000);
    </script>
</body>
</html>
