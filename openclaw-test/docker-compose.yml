# OpenClaw Test 实例 - 独立部署
# 端口: 8445

version: '3.8'

services:
  openclaw-test:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-test
    restart: unless-stopped
    ports:
      - "0.0.0.0:16789:18789"  # test 实例: 16789（允许外部访问）
    expose:
      - "18789"
    networks:
      - openclaw-test-net
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - INSTANCE_NAME=test
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/home/node/.openclaw/workspace
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-test:
    image: nginx:alpine
    container_name: nginx-test
    restart: unless-stopped
    ports:
      - "8445:443"
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/ssl:ro
    networks:
      - openclaw-test-net
    depends_on:
      - openclaw-test
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  openclaw-test-net:
    driver: bridge
